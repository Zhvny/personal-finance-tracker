# ============================================================
# Finance Tracker — Docker Compose (Development)
# ============================================================
# Microservice topology (stage 1):
#   gateway    -> localhost:8444  (public entry, exact-route proxy)
#   platform   -> internal :8450  auth/profiles/logs/ws/telegram/config
#   ledger     -> internal :8451  expenses/income/transactions/budget/goals
#   portfolio  -> internal :8452  investments/reports/dashboard
#   market     -> internal :8453  stocks/ml/genetic/senate/scheduler
#   insights   -> internal :8454  receipts OCR/ai/analytics/anomalies
#   engagement -> internal :8455  behavioral/rewards
#   postgres   -> localhost:5432
#   web        -> localhost:3000
#
# NOTE: dev-only dummy DB password 'password' committed intentionally
# (localhost only, no real data). Prod uses ${POSTGRES_PASSWORD}.
#
# honey: all Python services share ONE image + shared Postgres (stage-1).
# Trigger to split images/DBs: a service needs independent scaling or deploy cadence.
# WebSocket /ws/* is proxied by gateway to platform (ALPHA_WS_UPSTREAM).
# ============================================================

x-python-common: &python-common
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  # Self-liveness only (bootstrap exposes /health/live on every service);
  # readiness probing stays the gateway's job via /health.
  healthcheck:
    test: ["CMD-SHELL", "python -c \"import os,urllib.request; urllib.request.urlopen('http://localhost:' + os.getenv('ALPHA_SERVICE_PORT', '8450') + '/health/live', timeout=3)\""]
    interval: 10s
    timeout: 5s
    retries: 6
    start_period: 20s
  environment: &python-env
    # honey: per-service override sets HOST=127.0.0.1 below for downstreams
    # (audit A-H06: keep internal services off the bridge network).
    DATABASE_URL: postgresql://postgres:password@postgres:5432/finance_tracker?schema=public
    PRISMA_PY_DEBUG_GENERATOR: "1"
    # Service-to-service token shared between gateway and downstreams.
    # Set ALPHA_SERVICE_TOKEN in .env (or deployment env) to a value
    # generated by: python -c 'import secrets; print(secrets.token_urlsafe(32))'
    # Audit A-H06: required so downstream services reject calls that
    # did not come through the gateway.
    ALPHA_SERVICE_TOKEN: ${ALPHA_SERVICE_TOKEN:?ALPHA_SERVICE_TOKEN must be set in .env - see services/runtime/service_token.py for how to generate it}
    # Required at import by apps/api/config.validate_security_settings.
    # Resolves from shell env first, then project .env (compose default) —
    # CI provides a dummy via job env; dev uses the real .env value.
    SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set in .env or environment}
  volumes: &python-volumes
    - ./apps:/app/apps
    - ./packages:/app/packages
    - ./services:/app/services
  depends_on:
    postgres:
      condition: service_healthy

services:
  # ─── Database ────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: finance-tracker-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: finance_tracker
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - alpha-public
      - alpha-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d finance_tracker"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─── Domain Services ─────────────────────────────────────
  # honey: two networks (audit A-H06).
  #   alpha-public  — gateway + web + postgres. Host-published ports live here.
  #   alpha-internal — gateway + downstreams + postgres. internal:true means
  #     no host port forwarding, so a container on the host (or another
  #     host) cannot reach downstreams directly. The gateway bridges both
  #     networks and is the only path from public traffic to downstreams.
  # Service-to-service auth via ALPHA_SERVICE_TOKEN is the second control
  # layer (defense in depth).
  platform:
    <<: *python-common
    container_name: alpha-platform
    command: python -m services.platform.main
    networks:
      - alpha-internal
    environment:
      <<: *python-env
      HOST: "0.0.0.0"
      ALPHA_SERVICE_PORT: "8450"

  ledger:
    <<: *python-common
    container_name: alpha-ledger
    command: python -m services.ledger.main
    networks:
      - alpha-internal
    environment:
      <<: *python-env
      HOST: "0.0.0.0"
      ALPHA_SERVICE_PORT: "8451"

  portfolio:
    <<: *python-common
    container_name: alpha-portfolio
    command: python -m services.portfolio.main
    networks:
      - alpha-internal
    environment:
      <<: *python-env
      HOST: "0.0.0.0"
      ALPHA_SERVICE_PORT: "8452"

  market:
    <<: *python-common
    container_name: alpha-market
    command: python -m services.market.main
    networks:
      - alpha-internal
    environment:
      <<: *python-env
      HOST: "0.0.0.0"
      ALPHA_SERVICE_PORT: "8453"

  insights:
    <<: *python-common
    container_name: alpha-insights
    command: python -m services.insights.main
    networks:
      - alpha-internal
    environment:
      <<: *python-env
      HOST: "0.0.0.0"
      ALPHA_SERVICE_PORT: "8454"

  engagement:
    <<: *python-common
    container_name: alpha-engagement
    command: python -m services.engagement.main
    networks:
      - alpha-internal
    environment:
      <<: *python-env
      HOST: "0.0.0.0"
      ALPHA_SERVICE_PORT: "8455"

  # ─── Public Entry ────────────────────────────────────────
  gateway:
    <<: *python-common
    container_name: alpha-gateway
    command: python -m services.gateway.main
    ports:
      - "8444:8444"
    networks:
      - alpha-public
      - alpha-internal
    environment:
      <<: *python-env
      HOST: "0.0.0.0"
      ALPHA_GATEWAY_PORT: "8444"
      ALPHA_SERVICE_PORT: "8444"
      ALPHA_GATEWAY_TARGETS: >-
        platform=http://platform:8450,
        ledger=http://ledger:8451,
        portfolio=http://portfolio:8452,
        market=http://market:8453,
        insights=http://insights:8454,
        engagement=http://engagement:8455
      # A-005: pin WS upstream to the compose service name. Without
      # this, the dev default (http://localhost:8450) reaches the
      # gateway's own loopback instead of the platform container.
      ALPHA_WS_UPSTREAM: http://platform:8450
    depends_on:
      postgres:
        condition: service_healthy
      platform:
        condition: service_healthy
      ledger:
        condition: service_healthy
      portfolio:
        condition: service_healthy
      market:
        condition: service_healthy
      insights:
        condition: service_healthy
      engagement:
        condition: service_healthy

  # ─── Next.js Frontend ────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8444}
    container_name: finance-tracker-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8444}
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      # Server-side upstream for Next.js route handlers/server components.
      # Default resolves to the gateway service on the compose network.
      ALPHA_API_INTERNAL_URL: ${ALPHA_API_INTERNAL_URL:-http://gateway:8444}
      # Bearer key attached server-side by /api/proxy and serverFetch.
      # No default: set FINANCE_TRACKER_API_KEY in .env or deployment env.
      # Never commit a real secret.
      FINANCE_TRACKER_API_KEY: ${FINANCE_TRACKER_API_KEY:-}
      DATABASE_URL: postgresql://postgres:password@postgres:5432/finance_tracker?schema=public
    volumes:
      - ./apps/web:/app/apps/web
      - ./packages:/app/packages
      - /app/apps/web/node_modules
      - /app/apps/web/.next
    networks:
      - alpha-public
    depends_on:
      - gateway
    develop:
      watch:
        - action: sync
          path: ./apps/web
          target: /app/apps/web
        - action: rebuild
          path: apps/web/package.json

  # ─── Python CLI (run on-demand, not as a daemon) ─────────
  cli:
    build:
      context: .
      dockerfile: apps/cli/Dockerfile
    container_name: finance-tracker-cli
    stdin_open: true
    tty: true
    profiles:
      - cli
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/finance_tracker?schema=public
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    volumes:
      - ./apps/cli:/app/apps/cli
      - ./packages:/app/packages
      - cli_data:/app/apps/cli/profiles
    networks:
      - alpha-internal
    depends_on:
      postgres:
        condition: service_healthy

networks:
  alpha-public:
    name: alpha-public
  alpha-internal:
    name: alpha-internal
    internal: true   # No external egress; downstreams can't reach the internet either.

volumes:
  postgres_data:
  cli_data:
