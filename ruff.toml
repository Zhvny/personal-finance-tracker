# Ruff configuration
line-length = 120
target-version = "py312"

[lint]
select = ["E", "F", "W", "I"]
# honey: 2026-08-24 safe autofix sweep 7352 -> 0 (5252 fixed).
# Mechanical style below = owned by `ruff format` / legacy one-liners.
# Accepted-remaining (documented debt, revisit on touch):
#   E402 x97   imports after sys.path bootstrap (packages/, services/, tests)
#   E722 x23   bare except - fixing changes exception semantics
#   F841 x30   unused locals (dead stores) - churn to strip manually
#   F821 x0   undefined-name in routers/cli — resolved 2026-10-14 (was x15, all fixed, none left)
#   F601 x9    repeated dict keys (receipt_reader parser) - later key wins
#   I001 x9   imports inside try/except one-liners (probe idiom, unfixable)
#   E731 x1, F404 x1, F811 x1 - singles
#   F401 x17   __init__.py re-exports (exempted via per-file-ignores)
ignore = [
  "E501", # formatter-owned; legacy lines beyond 120
  "E701", # compound one-liners, pervasive in legacy CLI/scripts
  "E702",
  "E741", # ambiguous l/I/O names, legacy
  "W291", # trailing/blank-line whitespace stragglers ruff can't auto-fix;
  "W293", # enforce via `ruff format` adoption instead
  "E402",
  "E722",
  "E731",
  "F404",
  "F601",
  "F811",
  "F841",
  "I001",
]

[lint.per-file-ignores]
"**/__init__.py" = ["F401"] # package re-exports are intentional
# Availability probes: import is the test - removal would break the probe.
"apps/cli/investment_tracker/test_sentiment_integration.py" = ["F401"]
"scripts/benchmark_calibration_spread.py" = ["F401"]
"scripts/check_postgres_data.py" = ["F401"]
"scripts/health_check.py" = ["F401"]
# Tests: pandas-style `== True` filters read fine in assertions.
"tests/**" = ["E712"]

[format]
quote-style = "double"
indent-style = "space"
