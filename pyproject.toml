[project]
name = "alpha-finance-tracker"
version = "0.1.0"
description = "Personal finance platform with multi-schema PostgreSQL backend, FastAPI gateway, and Next.js dashboard."
authors = [
    {name = "Zhvny", email = "fransisuksxaveriuskevin17@gmail.com"},
]
readme = "README.md"
requires-python = ">=3.12,<3.13"

# Production dependencies. GENERATED — kept in sync with requirements.prod.txt via scripts/sync_requirements.py.
# Do not edit requirements.prod.txt manually; run `python scripts/sync_requirements.py`.
# Poetry reads this section for `poetry install` / `poetry add`.
# Lower bounds pinned; upper bounds omitted to follow semver + let
# transitive resolution find compatible updates.
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.1",
    "pydantic>=2.7.4",
    "pydantic-settings>=2.3.3",
    "prisma>=0.13.1",
    "python-dotenv>=1.0.1",
    "psycopg2-binary>=2.9.9",
    "requests>=2.31.0",
    "numpy>=1.26.0",
    "python-multipart>=0.0.18",
    "sqlalchemy>=2.0.28",
    "apscheduler>=3.10.0",
    "xgboost>=2.0.0",
    "httpx>=0.27.0",
    "pandas>=2.0.0",
    "yfinance>=0.2.40",
    "tenacity>=8.2.0",
    "pytesseract>=0.3.10",
    "scikit-learn>=1.3.0",
    "rich>=13.0.0",
    "redis>=5.0.0",
    "websockets>=12.0",
]

# Dev dependencies for testing + linting. Installed by `poetry install` (with dev groups).
[tool.poetry.group.dev.dependencies]
pytest = "^9.0"
pytest-asyncio = ">=0.25"
pytest-cov = "^6.0"
ruff = "==0.6.9"
textual = ">=0.47.0"
psutil = ">=5.9"
pip-audit = ">=2.7"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# This project is a monorepo and is not packaged as a wheel; it's run directly
# via `python -m` and uvicorn from the working tree. Disable package mode so
# `poetry install` only manages dependencies, not packaging.
[tool.poetry]
package-mode = false

# ──────────────────────────────────────────────────────────────────────
# Pytest + coverage configuration (preserved from previous file)
# ──────────────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-p no:warnings"
asyncio_mode = "auto"

[tool.coverage.run]
source = ["apps", "packages"]
omit = [
    "*/tests/*",
    "*/scripts/*",
    "*/__pycache__/*",
    "*/migrations/*",
    "*/backtests/*",
    # UI/view layers (manual/snapshot test territory)
    "*/cli_view.py",
    "*/tui.py",
    # Node/frontend — irrelevant to pytest
    "*/node_modules/*",
    "*/web/src/*",
]

[tool.coverage.report]
fail_under = 40
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "except ImportError",
    "def __repr__",
]
