name: E2E Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  e2e:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      # Dummy service token for compose interpolation (dev-only value;
      # never a real secret — mirrors CI's other placeholder envs).
      ALPHA_SERVICE_TOKEN: e2e-dummy-token-not-secure-only-for-tests
      # Required at import by apps/api/config.validate_security_settings
      # (no default is shipped); test-only dummy like the rest.
      SECRET_KEY: e2e-dummy-secret-not-secure-only-for-tests # pragma: allowlist secret (test-only dummy)
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Install Playwright browsers
        run: pnpm --filter @finance-tracker/web exec playwright install --with-deps chromium

      - name: Start services
        # NOTE: explicit -f disables the auto-loaded docker-compose.override.yml,
        # which repoints `web` at the legacy packages/web dev frontend. E2E must
        # exercise the canonical stack (apps/web + services) only.
        run: docker compose -f docker-compose.yml up -d

      - name: Wait for services
        run: |
          timeout 180 bash -c 'until curl -sf http://localhost:8444/health; do sleep 2; done'
          timeout 120 bash -c 'until curl -sf http://localhost:3000/ > /dev/null; do sleep 2; done'

      - name: Warn on missing FINANCE_TRACKER_API_KEY (DEV-ONLY fallback)
        env:
          TRACKER_KEY: ${{ secrets.FINANCE_TRACKER_API_KEY }} # pragma: allowlist secret (env indirection, never echoed)
        run: |
          if [ -z "$TRACKER_KEY" ]; then
            echo "::warning::FINANCE_TRACKER_API_KEY secret is empty — E2E uses DEV-ONLY dummy key; auth-gated cases run against dev stub, not real auth. No secret committed."
          fi

      - name: Run E2E tests
        working-directory: apps/web
        run: pnpm test:e2e:ci
        env:
          PLAYWRIGHT_API_URL: http://localhost:8444
          PLAYWRIGHT_WEB_URL: http://localhost:3000
          # Empty secret falls back to a marked dev dummy (never a real secret)
          # so the job degrades instead of failing mysteriously on auth.
          FINANCE_TRACKER_API_KEY: ${{ secrets.FINANCE_TRACKER_API_KEY || 'DEV-ONLY-dummy-e2e-key-not-a-secret' }}
          CI: true

      - name: Dump service status on failure
        if: failure()
        run: |
          docker compose -f docker-compose.yml ps
          docker compose -f docker-compose.yml logs --tail=150 platform ledger portfolio market insights engagement gateway web

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 14
