# Jaeger distributed tracing deployment
# Adds to your existing k8s manifests or deploy separately

---
# Jaeger Collector ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: jaeger
  labels:
    app: jaeger
spec:
  data:
    jaeger-config.yaml: |
      collector:
        zipkin:
          host-port: 9411
      storage:
        type: badger
        badger:
          ephemeral: false
          persistence_storage: /var/data/badger
      ui:
        base_path: /jaeger

---
# Jaeger Deployment (all-in-one for dev/small prod)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  labels:
    app: jaeger
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "14269"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.56
          env:
            - name: SPAN_STORAGE_TYPE
              value: badger
            - name: BADGER_EPHEMERAL
              value: "false"
            - name: BADGER_STORAGE_DIR
              value: /var/data/badger
            - name: COLLECTOR_ZIPKIN_HOST_PORT
              value: "9411"
          ports:
            - containerPort: 14250
              name: grpc
            - containerPort: 14268
              name: thrift-http
            - containerPort: 9411
              name: zipkin
            - containerPort: 16686
              name: ui
            - containerPort: 14269
              name: metrics
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
---
# Jaeger Service
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  labels:
    app: jaeger
spec:
  ports:
    - port: 14250
      targetPort: 14250
      name: grpc
    - port: 14268
      targetPort: 14268
      name: thrift-http
    - port: 9411
      targetPort: 9411
      name: zipkin
    - port: 16686
      targetPort: 16686
      name: ui
  selector:
    app: jaeger

---
# OpenTelemetry Collector (sidecar for services)
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector
  labels:
    app: otel-collector
spec:
  data:
    otel-config.yaml: |
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
            http:
              endpoint: 0.0.0.0:4318
        jaeger:
          protocols:
            thrift_http:
              endpoint: 0.0.0.0:14268

      processors:
        batch:
          timeout: 10s
          batch_size: 1024

      exporters:
        otlp:
          endpoint: jaeger:14250
          tls:
            insecure: true
        prometheus:
          endpoint: 0.0.0.0:8889

      service:
        pipelines:
          traces:
            receivers: [otlp, jaeger]
            processors: [batch]
            exporters: [otlp]
          metrics:
            receivers: [otlp]
            processors: [batch]
            exporters: [prometheus]

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  labels:
    app: otel-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
    spec:
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.96.0
          args:
            - --config=/etc/otel-collector-config.yaml
          volumeMounts:
            - name: config
              mountPath: /etc
          ports:
            - containerPort: 4317
              name: otlp-grpc
            - containerPort: 4318
              name: otlp-http
            - containerPort: 14268
              name: jaeger
            - containerPort: 8889
              name: prometheus
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: otel-collector
