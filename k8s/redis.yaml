# Task 6: Redis StatefulSet + Service for K8s
# Reuses the existing redis package; no new dependency.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  labels:
    app: alpha
    tier: cache
spec:
  serviceName: "redis"
  replicas: 1
  selector:
    matchLabels:
      app: alpha-redis
  template:
    metadata:
      labels:
        app: alpha-redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
          name: redis
        volumeMounts:
        - name: redis-data
          mountPath: /data
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "100m"
            memory: "128Mi"
  volumeClaimTemplates:
  - metadata:
      name: redis-data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    app: alpha
    tier: cache
spec:
  clusterIP: None
  ports:
  - port: 6379
    targetPort: 6379
  selector:
    app: alpha-redis
