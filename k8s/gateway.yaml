# Alpha platform microservice topology.
# honey: one shared backend image (finance-tracker-api:latest); services differ by command.
# Trigger to split images/DBs: a service needs independent scaling or deploy cadence.
# Tailscale sidecar lives on gateway only (single public entry).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alpha-gateway
  labels:
    app: alpha
    tier: gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: alpha-gateway
  template:
    metadata:
      labels:
        app: alpha-gateway
    spec:
      containers:
      - name: gateway
        image: finance-tracker-api:latest
        imagePullPolicy: IfNotPresent
        command: ["python", "-m", "services.gateway.main"]
        env:
        - name: ALPHA_GATEWAY_PORT
          value: "8444"
        - name: ALPHA_GATEWAY_TARGETS
          value: "platform=http://alpha-platform:8450,ledger=http://alpha-ledger:8451,portfolio=http://alpha-portfolio:8452,market=http://alpha-market:8453,insights=http://alpha-insights:8454,engagement=http://alpha-engagement:8455"
        ports:
        - containerPort: 8444
        livenessProbe:
          httpGet:
            path: /health
            port: 8444
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8444
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
      - name: tailscale
        image: tailscale/tailscale:latest
        env:
        - name: TS_AUTHKEY
          valueFrom:
            secretKeyRef:
              name: tailscale-auth
              key: TS_AUTHKEY
        - name: TS_KUBE_SECRET
          value: "tailscale-state"
        - name: TS_USERSPACE
          value: "true"
        securityContext:
          capabilities:
            add:
            - NET_ADMIN
---
apiVersion: v1
kind: Service
metadata:
  name: alpha-gateway
spec:
  selector:
    app: alpha-gateway
  ports:
    - protocol: TCP
      port: 8444
      targetPort: 8444
  type: ClusterIP
