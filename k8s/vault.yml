# HashiCorp Vault deployment for secret management
# Production setup with Kubernetes auth and auto-unseal

---
# Vault ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-config
  labels:
    app: vault
spec:
  data:
    vault-config.json: |
      {
        "listener": [{
          "tcp": {
            "address": "0.0.0.0:8200",
            "tls_disable": "true"
          }
        }],
        "storage": {
          "postgresql": {
            "connection_url": "postgresql://postgres:changeme@postgres:5432/vault?sslmode=disable",
            "ha_enabled": "true",
            "table": "vault_kv"
          }
        },
        "service_registration": {
          "kubernetes": {}
        },
        "ui": true,
        "api_addr": "http://vault:8200",
        "cluster_addr": "http://vault:8201"
      }

---
# Vault Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault
  labels:
    app: vault
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vault
  template:
    metadata:
      labels:
        app: vault
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8200"
        prometheus.io/path: "/v1/sys/metrics"
    spec:
      containers:
        - name: vault
          image: hashicorp/vault:1.16
          env:
            - name: VAULT_ADDR
              value: "http://vault:8200"
            - name: SKIP_CHOWN
              value: "true"
            - name: SKIP_SETCAP
              value: "true"
            - name: VAULT_K8S_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: VAULT_K8S_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - containerPort: 8200
              name: http
            - containerPort: 8201
              name: https-internal
          args:
            - "server"
            - "-config=/vault/config/vault-config.json"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /v1/sys/health?standbyok=true
              port: 8200
            initialDelaySeconds: 5
            periodSeconds: 5
      initContainers:
        - name: vault-init
          image: hashicorp/vault:1.16
          env:
            - name: VAULT_ADDR
              value: "http://vault:8200"
          args:
            - "operator"
            - "init"
            - "-key-shares=5"
            - "-key-threshold=3"
            - "-format=json"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
---
# Vault Service
apiVersion: v1
kind: Service
metadata:
  name: vault
  labels:
    app: vault
spec:
  ports:
    - port: 8200
      targetPort: 8200
      name: http
    - port: 8201
      targetPort: 8201
      name: https-internal
  selector:
    app: vault

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-setup
  labels:
    app: vault
binaryData:
  vault-setup.sh: |
    #!/bin/bash
    set -e

    # Wait for Vault to be ready
    sleep 5

    # Enable Kubernetes auth
    vault auth enable kubernetes

    # Configure Kubernetes auth
    vault write auth/kubernetes/config \
      token_reviewer_jwt="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)" \
      kubernetes_host="https://$KUBERNETES_PORT_443_TCP_ADDR:443" \
      kubernetes_ca_cert=@/var/run/secrets/kubernetes.io/serviceaccount/ca.crt

    # Create policy for alpha services
    vault policy write alpha-app /vault/policies/alpha-app.hcl

    # Create app role
    vault write auth/kubernetes/role/alpha-app \
      bound_service_account_names=alpha-api,alpha-gateway \
      bound_service_account_namespaces=default \
      policies=alpha-app \
      ttl=24h

---
# Example Vault policy (alpha-app.hcl)
# Save as policies/alpha-app.hcl and apply with: vault policy write alpha-app policies/alpha-app.hcl
path "secret/data/alpha/*" {
  capabilities = ["read", "write"]
}

path "secret/metadata/alpha/*" {
  capabilities = ["list"]
}

path "database/creds/alpha-* {
  capabilities = ["read"]
}

path "pki/issue/alpha-domain" {
  capabilities = ["create", "update"]
}
