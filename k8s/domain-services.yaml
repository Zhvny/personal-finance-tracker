apiVersion: apps/v1
kind: Deployment
metadata:
  name: alpha-platform
  labels:
    app: alpha
    tier: domain
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alpha-platform
  template:
    metadata:
      labels:
        app: alpha-platform
    spec:
      containers:
      - name: platform
        image: finance-tracker-api:latest
        imagePullPolicy: IfNotPresent
        command: ["python", "-m", "services.platform.main"]
        env:
        - name: ALPHA_SERVICE_PORT
          value: "8450"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: DATABASE_URL
        ports:
        - containerPort: 8450
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8450
          initialDelaySeconds: 40
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8450
          initialDelaySeconds: 20
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3
        resources:
          limits:
            cpu: "1000m"
            memory: "1Gi"
          requests:
            cpu: "250m"
            memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: alpha-platform
spec:
  selector:
    app: alpha-platform
  ports:
    - protocol: TCP
      port: 8450
      targetPort: 8450
  type: ClusterIP
--- 
