apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: finance-tracker-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
  - host: quant.internal
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: alpha-gateway
            port:
              number: 8444
