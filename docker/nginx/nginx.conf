events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 50M;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # ── Hide Nginx version fingerprint ──────────────────────────────────────
    server_tokens off;

    # ── Security headers map (applied globally) ──────────────────────────────
    # CSP directives breakdown:
    #
    #   default-src 'self'
    #     → Baseline: semua resource dari origin sendiri
    #
    #   script-src 'self' 'nonce-{nonce}'
    #     → JS hanya dari origin sendiri. Inline scripts diblokir kecuali
    #       ada nonce (React/Vite butuh ini untuk hydration).
    #
    #   style-src 'self' 'unsafe-inline' https://fonts.googleapis.com
    #     → CSS dari origin sendiri + Google Fonts + inline styles.
    #       'unsafe-inline' diperlukan karena React menggunakan inline styles
    #       (style={{ ... }} di JSX). Ini tidak bisa dihindari tanpa refactor besar.
    #
    #   img-src 'self' data: blob: https://lh3.googleusercontent.com https://drive.google.com
    #     → Gambar dari origin, data URIs (chart), blob URLs (kamera OCR),
    #       dan Google CDN untuk foto profil.
    #
    #   font-src 'self' https://fonts.gstatic.com
    #     → Font dari origin + Google Fonts CDN.
    #
    #   connect-src 'self' wss: https://api.binance.com https://finance.yahoo.com https://query1.finance.yahoo.com https://query2.finance.yahoo.com https://finnhub.io https://api.coingecko.com
    #     → API calls: backend sendiri (REST + WebSocket HMR), Binance, Yahoo
    #       Finance, Finnhub, CoinGecko untuk data pasar live.
    #
    #   worker-src 'self' blob:
    #     → Service Worker (PWA) dan web workers.
    #
    #   frame-ancestors 'none'
    #     → Mencegah app di-embed di iframe (clickjacking protection).
    #       Lebih kuat dari X-Frame-Options.
    #
    #   form-action 'self'
    #     → Form hanya boleh submit ke origin sendiri.
    #
    #   base-uri 'self'
    #     → Mencegah <base> tag injection untuk redirect attack.
    #
    #   object-src 'none'
    #     → Menonaktifkan Flash, PDF plugins, dll.
    #
    #   upgrade-insecure-requests
    #     → Paksa semua HTTP sub-resource ke HTTPS secara otomatis.

    map $uri $csp_header {
        default "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https://lh3.googleusercontent.com https://drive.google.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' wss: https://api.binance.com https://finance.yahoo.com https://query1.finance.yahoo.com https://query2.finance.yahoo.com https://finnhub.io https://api.coingecko.com; worker-src 'self' blob:; frame-ancestors 'none'; form-action 'self'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests";
    }

    # ── API backend ─────────────────────────────────────────
    upstream api_backend {
        server api:8444;
        keepalive 32;
    }

    # ── Web frontend ─────────────────────────────────────────
    upstream web_frontend {
        server web:3000;
        keepalive 32;
    }

    # ── HTTP → HTTPS Redirect ─────────────────────────────────
    server {
        listen 80;
        server_name _;

        # ACME challenge passthrough (Let's Encrypt)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Health check (untuk load balancer / uptime monitor)
        location /health {
            return 200 'OK';
            add_header Content-Type text/plain;
        }

        # Redirect semua traffic HTTP → HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS Main Server ─────────────────────────────────────
    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        # ── TLS / SSL ─────────────────────────────────────────
        ssl_certificate     /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;

        # Modern TLS config (Mozilla Intermediate)
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;
        ssl_stapling        on;
        ssl_stapling_verify on;

        # ── Security Headers (applied to ALL responses) ───────
        #
        # Content-Security-Policy — inti dari perlindungan XSS
        add_header Content-Security-Policy    $csp_header always;

        # Strict-Transport-Security (HSTS)
        # max-age=31536000 = 1 tahun; includeSubDomains; preload untuk submit ke HSTS preload list
        add_header Strict-Transport-Security  "max-age=31536000; includeSubDomains; preload" always;

        # Mencegah browser menebak MIME type (MIME sniffing attack)
        add_header X-Content-Type-Options     "nosniff" always;

        # Mencegah clickjacking — gunakan frame-ancestors di CSP sebagai pengganti yang lebih kuat
        add_header X-Frame-Options            "DENY" always;

        # Mengaktifkan XSS filter bawaan browser (legacy browsers)
        add_header X-XSS-Protection           "1; mode=block" always;

        # Kontrol informasi Referer yang dikirim
        add_header Referrer-Policy            "strict-origin-when-cross-origin" always;

        # Permissions Policy — menonaktifkan fitur browser berbahaya
        # camera: izinkan untuk OCR receipt reader
        # microphone, geolocation, payment: tidak digunakan, diblokir
        add_header Permissions-Policy         "camera=(self), microphone=(), geolocation=(), payment=()" always;

        # Cross-Origin policies
        add_header Cross-Origin-Opener-Policy  "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;

        # ── Health Check ──────────────────────────────────────
        location /health {
            return 200 'OK';
            add_header Content-Type text/plain;
        }

        # ── API routes → FastAPI Backend ──────────────────────
        location /api/ {
            proxy_pass         http://api_backend/api/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;

            # Tidak perlu CSP pada API responses (JSON) — hanya untuk HTML/JS
            # tapi header lain tetap berlaku via global add_header di atas
        }

        # ── Static Assets: Agresif Cache ──────────────────────
        # Vite menghasilkan asset dengan content-hash di nama file
        # sehingga aman di-cache permanen
        location ~* \.(js|css|woff2?|ttf|eot|otf|svg|png|jpg|jpeg|gif|ico|webp)$ {
            proxy_pass         http://web_frontend;
            proxy_set_header   Host $host;

            # Cache 1 tahun untuk hashed assets
            expires            1y;
            add_header         Cache-Control "public, max-age=31536000, immutable" always;

            # CSP dan security headers tetap berlaku
            add_header         Content-Security-Policy $csp_header always;
            add_header         X-Content-Type-Options "nosniff" always;
        }

        # ── Frontend SPA (React/Vite) ─────────────────────────
        location / {
            proxy_pass         http://web_frontend;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;

            # WebSocket support (Vite HMR di development)
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";

            # HTML tidak boleh di-cache (SPA shell selalu fresh)
            add_header         Cache-Control "no-store, no-cache, must-revalidate" always;
        }
    }
}
